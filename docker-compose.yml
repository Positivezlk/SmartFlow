services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartflow
      POSTGRES_USER: smartflow
      POSTGRES_PASSWORD: smartflow
    ports:
      - "5432:5432"
